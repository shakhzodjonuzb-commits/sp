
name: Build mod

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build Forge mod
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: seamlessportals-jar
          path: build/libs/*.jar
          if-no-files-found: error
